<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쿼리도</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e4e2dc;color:#2b2a27;font-family:"Segoe UI","Malgun Gothic",sans-serif;user-select:none}
#app{display:flex;height:100%;align-items:center;justify-content:center;gap:40px;padding:20px}
#cv{border-radius:20px;box-shadow:0 1px 2px #0001,0 12px 32px #0000001a;cursor:pointer}
#side{width:260px;display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 4px;font-size:30px;font-weight:700;letter-spacing:-0.5px}
h1 span{color:#9ca3af;font-weight:400;font-size:14px;margin-left:8px;letter-spacing:0}
#players{display:flex;flex-direction:column;gap:8px}
.pl{padding:12px 14px;border-radius:14px;background:#efede7;border:1.5px solid #d9d6ce;transition:.2s}
.pl.on{border-color:var(--c);box-shadow:0 4px 14px color-mix(in srgb,var(--c) 25%,transparent)}
.pl .n{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.pl .n i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pl .n em{margin-left:auto;font-style:normal;font-size:12px;color:var(--c)}
.stock{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;min-height:18px}
.stock i{display:block;width:5px;height:18px;border-radius:3px;background:var(--c)}
.modes{display:flex;gap:6px}
.modes button{flex:1}
button{font:inherit;font-size:13px;color:#3d3b36;background:#efede7;border:1.5px solid #d9d6ce;border-radius:10px;padding:9px 10px;cursor:pointer;font-weight:600;transition:.15s}
button:hover{border-color:#9ca3af}
button.sel{background:#111827;border-color:#111827;color:#fff}
#status{font-size:13px;color:#6b7280;min-height:18px}
.help{font-size:12px;line-height:1.7;color:#9ca3af}
kbd{background:#e5e7eb;color:#4b5563;border-radius:4px;padding:1px 6px;font-size:11px}
#overlay{position:fixed;inset:0;background:#e4e2dcf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;backdrop-filter:blur(6px)}
#overlay h2{font-size:42px;margin:0;font-weight:700;letter-spacing:-1px}
#overlay .sub{color:#9ca3af;font-size:15px}
#overlay .row{display:flex;gap:12px}
#overlay button{font-size:16px;padding:14px 32px;border-radius:12px}
#overlay button:hover{background:#111827;color:#fff;border-color:#111827}
.items{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.items button{padding:4px 9px;font-size:12px;border-radius:8px}
.items button:disabled{opacity:.45;cursor:default}
.items button:disabled:hover{border-color:#d9d6ce}
.items .none{font-size:12px;color:#9ca3af}
#overlay small{font-size:12px;opacity:.6;font-weight:400}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#2b2a27;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#overlay select,#overlay .codein{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid #d9d6ce;border-radius:10px;background:#efede7;color:#2b2a27;outline:0}
#overlay .codein{width:120px;text-align:center;letter-spacing:4px;text-transform:uppercase}
.bigcode{font-size:56px;font-weight:700;letter-spacing:12px;margin-left:12px;font-family:Consolas,monospace}
button:disabled{opacity:.45;cursor:default}
.names{display:flex;flex-direction:column;gap:10px;min-width:280px}
.names label{display:flex;align-items:center;gap:10px;background:#efede7;border:1.5px solid #d9d6ce;border-radius:12px;padding:8px 12px}
.names label i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.names label span{font-size:12px;color:#9ca3af;width:44px}
.names input{flex:1;font:inherit;font-size:16px;border:0;background:transparent;outline:0;color:#2b2a27}
</style>
</head>
<body>
<div id="app">
 <canvas id="cv"></canvas>
 <div id="side">
  <h1>쿼리도<span>Quoridor</span></h1>
  <div id="players"></div>
  <div class="modes">
   <button id="bMove">이동 (E)</button>
   <button id="bWall">벽 (W)</button>
   <button id="bRot">회전 (R)</button>
  </div>
  <button id="bUndo">↶ 1턴 되돌리기 (Z)</button>
  <div id="status" style="font-size:15px"></div>
  <div class="help">
   <kbd>E</kbd> 이동 모드 · <kbd>W</kbd> 벽 모드 · <kbd>R</kbd> 또는 우클릭 벽 회전<br>
   벽 모드에서 칸 사이 홈에 마우스를 올리면 미리보기가 나와요. 클릭하면 설치!<br>
   상대 길을 완전히 막는 벽은 놓을 수 없어요.<br>아이템전: 노란 ? 상자의 주변 8칸 안으로 들어가면 아이템을 얻어요. (4인은 상자 2개)
  </div>
  <button id="bRestart">처음으로</button>
 </div>
</div>
<div id="overlay"></div><div id="toast"></div>
<script>
const N=9,GR=0.25;
const COL=['#3b82f6','#ef4444','#22c55e','#f59e0b'];
const NAME=['파랑','빨강','초록','노랑'];
const DEF=[...NAME],POS=['아래','위','왼쪽','오른쪽'];
const PURPLE='#a855f7';
const ITEMS={
 extra:{name:'2턴 쓰기',desc:'상대 말을 잠가서 한 번 더 움직여요'},
 plus:{name:'벽 +2',desc:'벽 2개를 추가로 받아요'},
 remove:{name:'벽 제거',desc:'벽 하나를 골라 없애요'},
 ell:{name:'ㄱ자 벽',desc:'ㄱ자 모양 벽을 한 번 놓아요 (R로 회전)'},
 ctrl:{name:'말 조종',desc:'이번 턴에 상대 말을 내가 움직여요'}
};
const ITEM_KEYS=Object.keys(ITEMS);
const TARGET_MODE={remove:'remove',ell:'ell',ctrl:'control'};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let hist=[],pre=null,ctrlT=null,bonusFor=-1,rot4=0,gid=0,fx=[],np=2,gm='normal',pawns,walls,left,order,ti,over,mode='move',hor=true,mouse=null,S,m,cs,gp,winner=-1,items,boxes;
const goalOf=(p,r,c)=>p==0?r==0:p==1?r==8:p==2?c==8:c==0;
const cur=()=>order[ti];
const other=p=>1-p;
const inb=(r,c)=>r>=0&&c>=0&&r<N&&c<N;
const D=[[1,0],[-1,0],[0,1],[0,-1]];
let seed=1;
function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
const net={online:false,ws:null,me:-1,room:null,hb:null,send(m){if(this.ws&&this.ws.readyState==1)this.ws.send(JSON.stringify(m));}};
const canAct=()=>!net.online||cur()===net.me;
const mine=p=>!net.online||p===net.me;
function start(n,g,sd){
 np=n;gm=g;seed=((sd!=null)?sd:Math.floor(Math.random()*4294967296))|0;
 pawns=[{r:8,c:4},{r:0,c:4},{r:4,c:0},{r:4,c:8}].slice(0,n).map(p=>({...p,locked:false,conf:0}));
 order=n==2?[0,1]:[0,2,1,3];
 const W=n==2?10:8;left=Array(n).fill(W);
 items=[[],[],[],[]];boxes=[];fx=[];ctrlT=null;bonusFor=-1;hist=[];pre=null;
 walls=[];ti=0;over=false;mode='move';hor=true;winner=-1;
 if(gm=='item')for(let i=0;i<(n==4?2:1);i++)spawnBox(true);
 document.getElementById('overlay').style.display='none';
 ui();draw();}
function spawnBox(first){
 for(let t=0;t<300;t++){
  let r,c;
  if(np==4){r=2+Math.floor(rnd()*5);c=2+Math.floor(rnd()*5);}
  else{r=first?4:2+Math.floor(rnd()*5);c=Math.floor(rnd()*9);}
  if(pawns.some(q=>Math.abs(q.r-r)<=1&&Math.abs(q.c-c)<=1))continue;
  if(boxes.some(b=>b.r==r&&b.c==c))continue;
  if(np==4&&t<200&&boxes.some(b=>Math.abs(b.r-r)<2&&Math.abs(b.c-c)<2))continue;
  boxes.push({r,c});return;}}function blocked(r,c,nr,nc,W=walls){
 for(const w of W){
  const L=w.L||2;
  if(w.h){if(nc==c&&Math.abs(nr-r)==1&&Math.min(r,nr)==w.r&&c>=w.c&&c<w.c+L)return true;}
  else{if(nr==r&&Math.abs(nc-c)==1&&Math.min(c,nc)==w.c&&r>=w.r&&r<w.r+L)return true;}
 }return false;}
const occ=(r,c)=>pawns.some(p=>p.r==r&&p.c==c);
function moves(p){
 const me=pawns[p],res=[];
 for(const[dr,dc]of D){
  const nr=me.r+dr,nc=me.c+dc;
  if(!inb(nr,nc)||blocked(me.r,me.c,nr,nc))continue;
  if(occ(nr,nc)){
   const jr=nr+dr,jc=nc+dc;
   if(inb(jr,jc)&&!blocked(nr,nc,jr,jc)&&!occ(jr,jc))res.push({r:jr,c:jc});
   else for(const[er,ec]of D){
    if(er==dr&&ec==dc||er==-dr&&ec==-dc)continue;
    const sr=nr+er,sc=nc+ec;
    if(inb(sr,sc)&&!blocked(nr,nc,sr,sc)&&!occ(sr,sc))res.push({r:sr,c:sc});}
  }else res.push({r:nr,c:nc});
 }return res;}
function reach(p,W){
 const s=pawns[p],seen=new Set([s.r*9+s.c]),q=[[s.r,s.c]];
 while(q.length){const[r,c]=q.shift();if(goalOf(p,r,c))return true;
  for(const[dr,dc]of D){const nr=r+dr,nc=c+dc;
   if(inb(nr,nc)&&!seen.has(nr*9+nc)&&!blocked(r,c,nr,nc,W)){seen.add(nr*9+nc);q.push([nr,nc]);}}}
 return false;}
const edges=w=>{const L=w.L||2,e=[];for(let i=0;i<L;i++)e.push(w.h?`h${w.r},${w.c+i}`:`v${w.r+i},${w.c}`);return e;};
function placeOK(arr){
 const ne=arr.flatMap(edges);
 for(const x of walls){
  if(edges(x).some(k=>ne.includes(k)))return false;
  for(const w of arr)if((x.L||2)==2&&(w.L||2)==2&&x.r==w.r&&x.c==w.c&&x.h!=w.h)return false;
 }
 const W=[...walls,...arr];
 for(let p=0;p<np;p++)if(!reach(p,W))return false;
 return true;}
const wallOK=w=>placeOK([w]);
const ellPieces=e=>{const right=e.rot==2||e.rot==3,down=e.rot==0||e.rot==3;
 return[{h:true,r:e.r,c:e.c+(right?1:0),L:1},{h:false,r:e.r+(down?1:0),c:e.c,L:1}];};function toast(msg){
 const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
 clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400);}
function take(p,id){const i=items[p].indexOf(id);if(i>=0)items[p].splice(i,1);}
function checkBox(p){
 if(gm!='item')return;
 const i=boxes.findIndex(b=>Math.abs(b.r-pawns[p].r)<=1&&Math.abs(b.c-pawns[p].c)<=1);
 if(i<0)return;
 boxes.splice(i,1);
 const id=ITEM_KEYS[Math.floor(rnd()*ITEM_KEYS.length)];
 items[p].push(id);
 toast(`${NAME[p]}: 랜덤박스에서 [${ITEMS[id].name}] 획득!`);
 spawnBox();}
function next(){
 if(pre){hist.push({s:pre,by:cur()});pre=null;}
 for(let p=0;p<np;p++){
  if(goalOf(p,pawns[p].r,pawns[p].c)){over=true;winner=p;mode='move';ui();draw();showWin();return;}}
 let nx=(ti+1)%order.length;
 if(bonusFor==cur()){bonusFor=-1;pawns.forEach(q=>q.locked=false);toast(`${NAME[cur()]} 보너스 턴! 한 번 더 움직여요`);nx=ti;}
 ti=nx;ui();draw();}
function showWin(){
 const o=document.getElementById('overlay');
 let btns;
 if(net.online)btns=(net.me===0?'<button id="again">다시 하기</button>':'')+'<button id="menu">나가기</button>';
 else btns='<button id="again">다시 하기</button><button id="menu">모드 선택</button>';
 o.innerHTML=`<h2 style="color:${COL[winner]}">${NAME[winner]} 승리</h2>${net.online&&net.me!==0?'<div class="sub">방장이 다시 시작하길 기다려요</div>':''}<div class="row">${btns}</div>`;
 o.style.display='flex';
 const ag=document.getElementById('again');
 if(ag)ag.onclick=()=>{if(net.online)net.send({t:'rematch'});else start(np,gm);};
 document.getElementById('menu').onclick=()=>{netClose();menu();};}
function menu(){
 const o=document.getElementById('overlay');
 o.innerHTML=`<h2>쿼리도</h2><div class="sub">모드를 선택하세요</div><div class="row"><button data-gm="normal">일반전</button><button data-gm="item">아이템전</button></div><button data-gm="online" style="font-size:16px;padding:12px 32px">🌐 온라인 대전</button>`;
 o.style.display='flex';bind();}
let pendingGm='normal';
function pickPlayers(g){
 pendingGm=g;
 const o=document.getElementById('overlay');
 o.innerHTML=`<h2>${g=='item'?'아이템전':'일반전'}</h2><div class="sub">인원을 선택하세요</div><div class="row"><button data-n="2">2명</button><button data-n="4">4명</button></div><button id="back" style="font-size:13px;padding:8px 16px">← 뒤로</button>`;
 bind();document.getElementById('back').onclick=menu;}
function nameScreen(n){
 const o=document.getElementById('overlay');
 o.innerHTML=`<h2>말 이름</h2><div class="sub">이름을 정해 주세요 (비워두면 기본 이름)</div><div class="names">${[...Array(n).keys()].map(i=>`<label style="--c:${COL[i]}"><i></i><span>${POS[i]}</span><input data-i="${i}" maxlength="8" placeholder="${DEF[i]}" value="${NAME[i]==DEF[i]?'':NAME[i]}"></label>`).join('')}</div><div class="row"><button id="go">시작</button></div><button id="back2" style="font-size:13px;padding:8px 16px">← 뒤로</button>`;
 const go=()=>{o.querySelectorAll('input').forEach(inp=>{NAME[+inp.dataset.i]=inp.value.trim()||DEF[+inp.dataset.i];});netClose();start(n,pendingGm);};
 document.getElementById('go').onclick=go;
 document.getElementById('back2').onclick=()=>pickPlayers(pendingGm);
 o.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();}));
 o.querySelector('input').focus();}function bind(){
 document.querySelectorAll('#overlay [data-n]').forEach(b=>b.onclick=()=>nameScreen(+b.dataset.n));
 document.querySelectorAll('#overlay [data-gm]').forEach(b=>b.onclick=()=>b.dataset.gm=='online'?onlineMenu():pickPlayers(b.dataset.gm));}function useItem(id){
 if(over||!canAct()||!items[cur()].includes(id))return;
 const p=cur();
 if(id=='extra'){if(bonusFor>=0){toast('이미 사용 중이에요');return;}perform({t:'extra'});}
 else if(id=='plus')perform({t:'plus'});
 else if(id=='remove'){if(!walls.length){toast('제거할 벽이 없어요');return;}setMode('remove');}
 else if(id=='ell')setMode('ell');
 else if(id=='ctrl'){ctrlT=np==2?other(p):null;setMode('control');}
}function ui(){
 const box=document.getElementById('players');box.innerHTML='';
 for(let p=0;p<np;p++){
  const d=document.createElement('div');d.className='pl'+(!over&&cur()==p?' on':'');d.style.setProperty('--c',COL[p]);
  let inv='';
  if(gm=='item'){
   const cnt={};items[p].forEach(i=>cnt[i]=(cnt[i]||0)+1);
   inv='<div class="items">'+(items[p].length?ITEM_KEYS.filter(k=>cnt[k]).map(k=>
    `<button data-it="${k}" title="${ITEMS[k].desc}" ${(over||cur()!=p||!canAct())?'disabled':''} class="${(cur()==p&&TARGET_MODE[k]==mode)?'sel':''}">${ITEMS[k].name}${cnt[k]>1?' ×'+cnt[k]:''}</button>`).join(''):'<span class="none">아이템 없음</span>')+'</div>';}
  d.innerHTML=`<div class="n"><i></i>${NAME[p]}${net.online&&p==net.me?' (나)':''}<em>${!over&&cur()==p?(net.online&&p!=net.me?'차례':'내 차례'):''}</em></div><div class="stock">${'<i></i>'.repeat(left[p])}</div>${inv}`;
  box.appendChild(d);}
 box.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>useItem(b.dataset.it));
 document.getElementById('bUndo').disabled=over||!hist.length||(net.online&&hist[hist.length-1].by!==net.me);
 document.getElementById('bMove').className=mode=='move'?'sel':'';
 document.getElementById('bWall').className=mode=='wall'?'sel':'';
 const hint={wall:`벽 방향: ${hor?'가로 ━':'세로 ┃'}`,ell:`ㄱ자 벽 모양: ${['ㄱ','┘','ㄴ','┌'][rot4]} (R: 회전, E: 취소)`,remove:'없앨 벽을 클릭하세요 (E: 취소)',control:ctrlT==null?'조종할 상대 말을 클릭하세요 (E: 취소)':'상대 말을 움직일 칸을 클릭하세요 (E: 취소)'};
 document.getElementById('status').textContent=!canAct()?(NAME[cur()]+' 님이 두는 중…'):(hint[mode]||'');}
function resize(){
 const dpr=window.devicePixelRatio||1;
 S=Math.min(window.innerHeight-32,window.innerWidth-340);
 S=Math.max(S,300);
 cv.style.width=cv.style.height=S+'px';cv.width=cv.height=S*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 m=S*0.055;cs=(S-2*m)/(9+8*GR);gp=cs*GR;draw();}
const X=c=>m+c*(cs+gp),Y=r=>m+r*(cs+gp);
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function wallRect(w){const L=w.L||2,len=L*cs+(L-1)*gp;return w.h?[X(w.c),Y(w.r)+cs,len,gp]:[X(w.c)+cs,Y(w.r),gp,len];}
function drawWall(w,col,alpha=1){
 const[x,y,a,b]=wallRect(w);
 ctx.save();ctx.globalAlpha=alpha;
 if(alpha>=1){ctx.shadowColor='#0003';ctx.shadowBlur=5;ctx.shadowOffsetY=2;}
 rr(x,y,a,b,w.g!=null?gp*.15:gp/2);ctx.fillStyle=col;ctx.fill();
 if(w.g!=null&&w.h){rr(X(w.ic.c)+cs-.5,Y(w.ic.r)+cs-.5,gp+1,gp+1,0);ctx.fill();}
 ctx.restore();}
function drawEll(pcs,ic,col,alpha){pcs.forEach(p=>drawWall({...p,g:0,ic},col,alpha));}function candidate(){
 if(!mouse||over||!canAct()||mode!='wall')return null;
 const u=cs+gp,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 const ix=Math.round((mouse.x-m-cs-gp/2)/u),iy=Math.round((mouse.y-m-cs-gp/2)/u);
 return{r:cl(iy,0,7),c:cl(ix,0,7),h:hor,L:2};}
function ellCand(){
 if(!mouse||over||!canAct()||mode!='ell')return null;
 const u=cs+gp,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 const ix=Math.round((mouse.x-m-cs-gp/2)/u),iy=Math.round((mouse.y-m-cs-gp/2)/u);
 return{r:cl(iy,0,7),c:cl(ix,0,7),rot:rot4};}function wallAt(){
 if(!mouse)return -1;
 const pad=gp*.7;
 for(let i=walls.length-1;i>=0;i--){
  const[x,y,a,b]=wallRect(walls[i]);
  if(mouse.x>=x-pad&&mouse.x<=x+a+pad&&mouse.y>=y-pad&&mouse.y<=y+b+pad)return i;}
 return -1;}
function drawBox(b,now){
 const x=X(b.c)+cs/2,y=Y(b.r)+cs/2+Math.sin(now/300+b.r+b.c)*cs*.03,s=cs*.52;
 ctx.save();ctx.shadowColor='#0003';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
 rr(x-s/2,y-s/2,s,s,s*.2);ctx.fillStyle='#fbbf24';ctx.fill();ctx.restore();
 rr(x-s/2,y-s/2,s,s,s*.2);ctx.strokeStyle='#d97706';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font=`bold ${s*.7}px "Segoe UI",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('?',x,y+s*.04);}
function drawLock(x,y,R){
 const u=R*.95;
 ctx.save();
 ctx.beginPath();ctx.arc(x,y,R+cs*.07,0,7);ctx.setLineDash([5,4]);ctx.strokeStyle='#6b7280';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.arc(x,y-u*.12,u*.3,Math.PI,0);ctx.strokeStyle='#fff';ctx.lineWidth=u*.14;ctx.stroke();
 rr(x-u*.46,y-u*.12,u*.92,u*.72,u*.14);ctx.fillStyle='#fff';ctx.fill();
 ctx.beginPath();ctx.arc(x,y+u*.2,u*.1,0,7);ctx.fillStyle='#6b7280';ctx.fill();
 ctx.restore();}
function drawConf(x,y,R,now){
 ctx.save();
 ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineCap='round';
 for(let k=0;k<2;k++){const a=now/180+k*Math.PI;ctx.beginPath();ctx.arc(x,y,R*.55,a,a+2.4);ctx.stroke();}
 for(let k=0;k<4;k++){
  const a=now/260+k*Math.PI/2,sx=x+Math.cos(a)*(R+cs*.14),sy=y+Math.sin(a)*(R+cs*.14)*.55-R*.15;
  ctx.beginPath();ctx.arc(sx,sy,cs*.05,0,7);ctx.fillStyle=k%2?'#fde047':'#e9d5ff';ctx.fill();}
 ctx.fillStyle='#fff';ctx.font=`bold ${R*.9}px "Segoe UI",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.globalAlpha=.85;ctx.fillText('?',x+Math.cos(now/140)*R*.9,y-R-cs*.12+Math.sin(now/140)*3);
 ctx.restore();}
function drawFx(now){
 const DUR=1000;
 fx=fx.filter(f=>now-f.t<DUR);
 for(const f of fx){
  const k=(now-f.t)/DUR,[x,y,a,b]=wallRect(f.w),cx=x+a/2,cy=y+b/2,horiz=a>b;
  const len=horiz?a:b,n=Math.max(4,Math.round(len/(gp*1.1))),seg=len/n;
  // 1) white flash + glow
  if(k<.25){
   const q=k/.25;
   ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=gp*3*q;
   rr(x,y,a,b,gp/2);ctx.fillStyle=q<.5?'#ffffff':f.col;ctx.fill();ctx.restore();
  }
  // 2) shards flying out
  if(k>.12){
   const q=(k-.12)/.88;
   for(let i=0;i<n;i++){
    const px=horiz?x+seg*(i+.5):cx,py=horiz?cy:y+seg*(i+.5);
    const dir=((i*7)%5)-2,ang=-Math.PI/2+dir*.5;
    const sp=cs*(.5+((i*13)%7)/10);
    const sx=px+Math.cos(ang)*sp*q+(horiz?(i-n/2)*gp*.4*q:dir*gp*.8*q);
    const sy=py+Math.sin(ang)*sp*q+cs*1.1*q*q;
    ctx.save();ctx.globalAlpha=Math.max(0,1-q*q);
    ctx.translate(sx,sy);ctx.rotate(q*(dir||1)*3.2);
    const s=gp*(1-.45*q);
    ctx.fillStyle=f.col;rr(-s*.9,-s*.9,s*1.8,s*1.8,s*.3);ctx.fill();
    ctx.restore();}
  }
  // 3) ring
  ctx.save();ctx.globalAlpha=Math.max(0,.7*(1-k*1.3));
  ctx.beginPath();ctx.arc(cx,cy,gp*.5+k*cs*1.1,0,7);ctx.strokeStyle=f.col;ctx.lineWidth=Math.max(.5,gp*.35*(1-k));ctx.stroke();ctx.restore();
 }}function drawName(s,x,y,al){
 ctx.save();ctx.globalAlpha=al;
 let fs=cs*.2;ctx.font=`600 ${fs}px "Segoe UI","Malgun Gothic",sans-serif`;
 const mw=cs*1.5,w=ctx.measureText(s).width;if(w>mw){fs*=mw/w;ctx.font=`600 ${fs}px "Segoe UI","Malgun Gothic",sans-serif`;}
 ctx.textAlign='center';ctx.textBaseline='top';
 ctx.lineWidth=3;ctx.strokeStyle='#f6f4eeee';ctx.lineJoin='round';ctx.strokeText(s,x,y);
 ctx.fillStyle='#374151';ctx.fillText(s,x,y);ctx.restore();}
function draw(){
 if(!pawns)return;
 const now=performance.now();const md=canAct()?mode:'-';
 ctx.clearRect(0,0,S,S);
 rr(0,0,S,S,20);ctx.fillStyle='#efede7';ctx.fill();
 rr(m-gp,m-gp,S-2*m+2*gp,S-2*m+2*gp,12);ctx.fillStyle='#dedbd3';ctx.fill();
 const t=gp*.9,o=gp*1.6;
 for(let p=0;p<np;p++){
  ctx.fillStyle=COL[p];ctx.globalAlpha=.85;
  if(p==0){rr(m,m-o-t/2,S-2*m,t,t/2);ctx.fill();}
  if(p==1){rr(m,S-m+o-t/2,S-2*m,t,t/2);ctx.fill();}
  if(p==2){rr(S-m+o-t/2,m,t,S-2*m,t/2);ctx.fill();}
  if(p==3){rr(m-o-t/2,m,t,S-2*m,t/2);ctx.fill();}
  ctx.globalAlpha=1;}
 let mv=[],mvc=COL[cur()];
 if(!over){
  if(md=='move')mv=moves(cur());
  if(md=='control'){mv=ctrlT==null?[]:moves(ctrlT);mvc=PURPLE;}}
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const x=X(c),y=Y(r);
  rr(x,y,cs,cs,cs*.14);ctx.fillStyle='#f6f4ee';ctx.fill();
  if(mv.some(q=>q.r==r&&q.c==c)){
   rr(x,y,cs,cs,cs*.14);ctx.fillStyle=mvc+'55';ctx.fill();}
 }
 for(const w of walls)drawWall(w,COL[w.o]);
 if(!over&&md=='remove'){
  const i=wallAt();
  if(i>=0){const g=walls[i].g;
   walls.filter((w,j)=>j==i||(g!=null&&w.g==g)).forEach(w=>{const[x,y,a,b]=wallRect(w);ctx.save();ctx.setLineDash([4,3]);ctx.lineWidth=2;ctx.strokeStyle='#ef4444';
    rr(x-3,y-3,a+6,b+6,gp/2+2);ctx.stroke();ctx.restore();});}} const cd=candidate();
 if(cd){const ok=left[cur()]>0&&wallOK(cd);drawWall(cd,ok?COL[cur()]:'#9ca3af',.3);
  const[x,y,a,b]=wallRect(cd);ctx.save();ctx.setLineDash([4,3]);ctx.lineWidth=1.5;
  rr(x,y,a,b,gp/2);ctx.strokeStyle=ok?COL[cur()]:'#ef4444';ctx.stroke();ctx.restore();}
 const ec=ellCand();
 if(ec){const pcs=ellPieces(ec),ok=placeOK(pcs),ic={r:ec.r,c:ec.c};
  drawEll(pcs,ic,ok?COL[cur()]:'#9ca3af',.3);
  pcs.forEach(p=>{const[x,y,a,b]=wallRect(p);ctx.save();ctx.setLineDash([4,3]);ctx.lineWidth=1.5;rr(x,y,a,b,gp*.15);ctx.strokeStyle=ok?COL[cur()]:'#ef4444';ctx.stroke();ctx.restore();});} drawFx(now);
 boxes.forEach(b=>drawBox(b,now));
 pawns.forEach((p,i)=>{
  let x=X(p.c)+cs/2,y=Y(p.r)+cs/2;const R=cs*.33;
  const conf=(now<p.conf)||(md=='control'&&!over&&(i==ctrlT||(ctrlT==null&&i!=cur()&&Math.sin(now/200)>0)));
  if(conf){x+=Math.sin(now/80+i)*cs*.035;y+=Math.cos(now/100)*cs*.025;}
  ctx.save();
  const ghost=md=='remove'&&!over;
  if(!over&&cur()==i&&!conf&&!ghost){ctx.beginPath();ctx.arc(x,y,R+cs*.09,0,7);ctx.strokeStyle=COL[i];ctx.globalAlpha=.4;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;}
  if(ghost)ctx.globalAlpha=.28;
  ctx.shadowColor='#0003';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fillStyle=conf?PURPLE:COL[i];ctx.fill();
  ctx.restore();
  drawName(NAME[i],x,y+R+cs*.04,ghost?.3:1);
  if(conf)drawConf(x,y,R,now);
  if(p.locked)drawLock(x,y,R);
 });
}
function pos(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*S/b.width,y:(e.clientY-b.top)*S/b.height};}
cv.addEventListener('mousemove',e=>{mouse=pos(e);});
cv.addEventListener('mouseleave',()=>{mouse=null;});
cv.addEventListener('contextmenu',e=>{e.preventDefault();rot();});
cv.addEventListener('click',e=>{
 if(over||!pawns)return;
 if(!canAct()){toast('상대 차례예요');return;}
 mouse=pos(e);
 const cellAt=()=>({c:Math.floor((mouse.x-m)/(cs+gp)),r:Math.floor((mouse.y-m)/(cs+gp))});
 if(mode=='move'){const{r,c}=cellAt();perform({t:'move',r,c});}
 else if(mode=='wall'){const w=candidate();if(w)perform({t:'wall',r:w.r,c:w.c,h:w.h});}
 else if(mode=='ell'){const q=ellCand();if(q)perform({t:'ell',r:q.r,c:q.c,rot:q.rot});}
 else if(mode=='remove'){const i=wallAt();if(i>=0)perform({t:'remove',i});}
 else if(mode=='control'){
  const{r,c}=cellAt(),p=cur();
  const hit=pawns.findIndex((q,i)=>i!=p&&q.r==r&&q.c==c);
  if(hit>=0){ctrlT=hit;ui();return;}
  if(ctrlT==null)return;
  perform({t:'ctrl',o:ctrlT,r,c});
 }});
function perform(a){
 if(net.online)net.send({t:'act',a});
 else apply(a,a.t=='undo'?null:cur());}
function snapshot(){return JSON.stringify({pawns,walls,left,items,boxes,ti,bonusFor,gid,seed});}
const inRange=(r,c)=>Number.isInteger(r)&&Number.isInteger(c)&&r>=0&&r<=7&&c>=0&&c<=7;
function apply(a,from){
 if(over||!pawns||!a)return;
 if(a.t=='undo'){
  if(!hist.length)return;
  if(from!==null&&hist[hist.length-1].by!==from)return;
  const en=hist.pop(),s=JSON.parse(en.s);
  pawns=s.pawns;walls=s.walls;left=s.left;items=s.items;boxes=s.boxes;ti=s.ti;bonusFor=s.bonusFor;gid=s.gid;seed=s.seed;
  mode='move';ctrlT=null;fx=[];pre=null;
  ui();draw();toast(`${NAME[en.by]}: 1턴 되돌렸어요`);return;}
 if(from!==cur())return;
 const p=cur();
 pre=snapshot();
 if(a.t=='move'){
  const mv=moves(p).find(q=>q.r==a.r&&q.c==a.c);if(!mv)return;
  pawns[p].r=mv.r;pawns[p].c=mv.c;checkBox(p);next();
 }else if(a.t=='wall'){
  const w={r:a.r,c:a.c,h:!!a.h,L:2};
  if(!inRange(a.r,a.c)||left[p]<=0||!wallOK(w))return;
  walls.push({...w,o:p});left[p]--;next();
 }else if(a.t=='ell'){
  if(!items[p].includes('ell')||!inRange(a.r,a.c))return;
  const pcs=ellPieces({r:a.r,c:a.c,rot:a.rot|0});if(!placeOK(pcs))return;
  const g=++gid;pcs.forEach(q=>walls.push({...q,o:p,g,ic:{r:a.r,c:a.c}}));
  take(p,'ell');if(mine(p))mode='move';next();
 }else if(a.t=='remove'){
  const i=a.i;if(!items[p].includes('remove')||!walls[i])return;
  const g=walls[i].g,gone=walls.filter((w,j)=>j==i||(g!=null&&w.g==g));
  gone.forEach(w=>fx.push({w:{...w},col:COL[w.o],t:performance.now()}));
  walls=walls.filter(w=>!gone.includes(w));
  take(p,'remove');if(mine(p))mode='move';toast('벽을 제거했어요');next();
 }else if(a.t=='ctrl'){
  const o=a.o;if(!items[p].includes('ctrl')||!pawns[o]||o===p)return;
  const mv=moves(o).find(q=>q.r==a.r&&q.c==a.c);if(!mv)return;
  pawns[o].r=mv.r;pawns[o].c=mv.c;pawns[o].conf=performance.now()+1800;
  take(p,'ctrl');if(mine(p)){mode='move';ctrlT=null;}
  checkBox(o);toast(`${NAME[o]} 말을 조종했어요!`);next();
 }else if(a.t=='extra'){
  if(!items[p].includes('extra')||bonusFor>=0)return;
  hist.push({s:pre,by:p});pre=null;
  take(p,'extra');bonusFor=p;pawns.forEach((q,i)=>{if(i!=p)q.locked=true;});
  toast('상대 말 잠금! 이번에 두 번 움직일 수 있어요');ui();draw();
 }else if(a.t=='plus'){
  if(!items[p].includes('plus'))return;
  hist.push({s:pre,by:p});pre=null;
  take(p,'plus');left[p]+=2;toast('벽 2개를 받았어요');ui();draw();
 }
}
function undo(){
 if(over)return;
 if(!hist.length){toast('되돌릴 턴이 없어요');return;}
 if(net.online&&hist[hist.length-1].by!==net.me){toast('내가 한 마지막 행동만 되돌릴 수 있어요');return;}
 perform({t:'undo'});}function setMode(x){mode=x;if(x!='control')ctrlT=null;ui();draw();}
function rot(){if(mode=='ell')rot4=(rot4+1)%4;else hor=!hor;ui();draw();}
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName=='INPUT')return;
 const k=e.key.toLowerCase();
 if(k=='e'||k=='ㄷ')setMode('move');
 if(k=='w'||k=='ㅈ')setMode('wall');
 if(k=='r'||k=='ㄱ')rot();
 if(k=='z'||k=='ㅋ')undo();});
document.getElementById('bMove').onclick=()=>setMode('move');
document.getElementById('bWall').onclick=()=>setMode('wall');
document.getElementById('bRot').onclick=rot;
document.getElementById('bUndo').onclick=undo;
document.getElementById('bRestart').onclick=()=>{if(net.online&&!confirm('온라인 방에서 나갈까요?'))return;netClose();menu();};
window.addEventListener('resize',resize);
function netUrl(){
 if(location.protocol.startsWith('http'))return(location.protocol=='https:'?'wss://':'ws://')+location.host;
 return localStorage.getItem('qurl')||'';}
function netClose(){
 clearInterval(net.hb);
 if(net.ws){net.ws.onclose=null;net.ws.onmessage=null;try{net.ws.close();}catch(e){}}
 net.ws=null;net.online=false;net.me=-1;net.room=null;}
function netConnect(url){
 return new Promise((res,rej)=>{
  let ws;try{ws=new WebSocket(url);}catch(e){rej(new Error('주소가 올바르지 않아요'));return;}
  const to=setTimeout(()=>{try{ws.close();}catch(e){}rej(new Error('서버 응답이 없어요. 잠시 후 다시 시도해 주세요'));},75000);
  ws.onopen=()=>{
   clearTimeout(to);net.ws=ws;
   clearInterval(net.hb);net.hb=setInterval(()=>net.send({t:'ping'}),25000);
   ws.onclose=()=>{if(net.ws!==ws)return;net.ws=null;
    if(net.online&&!over){over=true;ui();draw();endScreen('연결이 끊겼어요','');}
    else if(!net.online){onlineMenu(null,'연결이 끊겼어요');}};
   res();};
  ws.onerror=()=>{clearTimeout(to);rej(new Error('서버에 연결할 수 없어요'));};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}onNet(m);};
 });}
function endScreen(title,sub){
 const o=document.getElementById('overlay');
 o.innerHTML=`<h2>${title}</h2><div class="sub">${sub}</div><div class="row"><button id="leave">나가기</button></div>`;
 o.style.display='flex';
 document.getElementById('leave').onclick=()=>{netClose();menu();};}
function onNet(m){
 if(m.t=='room'){net.room=m;net.me=m.seat;roomScreen();}
 else if(m.t=='start'){
  net.online=true;
  for(let i=0;i<m.n;i++)NAME[i]=m.names[i]||DEF[i];
  start(m.n,m.mode,m.seed);}
 else if(m.t=='act')apply(m.a,m.from);
 else if(m.t=='left'){
  if(over)return;
  over=true;mode='move';ui();draw();
  endScreen('상대가 나갔어요',`${m.name} 님의 연결이 끊겼어요`);}
 else if(m.t=='error')onlineMenu(null,m.msg);}
function onlineMenu(code,msg){
 netClose();
 const o=document.getElementById('overlay');
 const needUrl=!location.protocol.startsWith('http');
 const nick=localStorage.getItem('qnick')||'';
 o.innerHTML=`<h2>온라인 대전</h2>
 <div class="names">
  <label style="--c:#3b82f6"><i></i><span>내 이름</span><input id="nick" maxlength="8" placeholder="이름" value="${nick}"></label>
  ${needUrl?`<label style="--c:#9ca3af"><i></i><span>서버</span><input id="srv" placeholder="wss://내서버.onrender.com" value="${localStorage.getItem('qurl')||''}"></label>`:''}
 </div>
 <div class="sub">방 만들기</div>
 <div class="row"><select id="mkMode"><option value="normal">일반전</option><option value="item">아이템전</option></select><select id="mkN"><option value="2">2명</option><option value="4">4명</option></select><button id="mk">만들기</button></div>
 <div class="sub">방 참가</div>
 <div class="row"><input id="code" class="codein" maxlength="4" placeholder="방 코드" value="${code||''}"><button id="jn">참가</button></div>
 <div id="lmsg" class="sub" style="min-height:22px;color:#ef4444">${msg||''}</div>
 <button id="back3" style="font-size:13px;padding:8px 16px">← 뒤로</button>`;
 o.style.display='flex';
 const lm=s=>{document.getElementById('lmsg').style.color='#6b7280';document.getElementById('lmsg').textContent=s;};
 const go=async first=>{
  const name=document.getElementById('nick').value.trim()||'플레이어';
  localStorage.setItem('qnick',name);
  let url=netUrl();
  if(needUrl){url=document.getElementById('srv').value.trim();localStorage.setItem('qurl',url);}
  if(!url){document.getElementById('lmsg').textContent='서버 주소를 입력해 주세요';return;}
  lm('서버에 연결 중… (무료 서버는 처음에 최대 1분 걸릴 수 있어요)');
  try{await netConnect(url);}catch(e){document.getElementById('lmsg').style.color='#ef4444';document.getElementById('lmsg').textContent=e.message;return;}
  first(name);};
 document.getElementById('mk').onclick=()=>go(name=>net.send({t:'create',name,mode:document.getElementById('mkMode').value,n:+document.getElementById('mkN').value}));
 const join=()=>{const c=document.getElementById('code').value.trim().toUpperCase();if(!c){document.getElementById('lmsg').textContent='방 코드를 입력해 주세요';return;}go(name=>net.send({t:'join',code:c,name}));};
 document.getElementById('jn').onclick=join;
 document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')join();});
 document.getElementById('back3').onclick=menu;}
function roomScreen(){
 const r=net.room,o=document.getElementById('overlay');
 const full=r.names.length>=r.n,link=location.protocol.startsWith('http')?`${location.origin}/?room=${r.code}`:'';
 o.innerHTML=`<h2>방 코드</h2><div class="bigcode">${r.code}</div>
 <div class="sub">${r.mode=='item'?'아이템전':'일반전'} · ${r.n}명 · 코드를 친구에게 알려주세요</div>
 <div class="names">${[...Array(r.n).keys()].map(i=>`<label style="--c:${COL[i]}"><i></i><span>${POS[i]}</span><b style="font-weight:600;color:${r.names[i]?'#2b2a27':'#9ca3af'}">${r.names[i]?r.names[i]+(i==net.me?' (나)':''):'대기 중…'}</b></label>`).join('')}</div>
 <div class="row">${link?'<button id="cp">링크 복사</button>':''}${net.me===0?`<button id="st" ${full?'':'disabled'}>시작</button>`:'<div class="sub">방장이 시작하길 기다려요</div>'}</div>
 <button id="lv" style="font-size:13px;padding:8px 16px">← 나가기</button>`;
 o.style.display='flex';
 const st=document.getElementById('st');if(st)st.onclick=()=>net.send({t:'begin'});
 const cp=document.getElementById('cp');if(cp)cp.onclick=()=>{navigator.clipboard.writeText(link).then(()=>toast('링크를 복사했어요'));};
 document.getElementById('lv').onclick=()=>{netClose();menu();};}
pawns=null;items=[[],[],[],[]];boxes=[];
menu();resize();
{const rc=new URLSearchParams(location.search).get('room');if(rc)onlineMenu(rc.toUpperCase().slice(0,4));}
(function loop(){try{draw();}catch(e){console.error(e);}requestAnimationFrame(loop);})();
</script>
</body>
